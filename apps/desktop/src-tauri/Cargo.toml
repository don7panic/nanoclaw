[package]
name = "nanoclaw-desktop"
version = "0.1.0"
description = "NanoClaw Desktop Setup Wizard"
authors = ["NanoClaw"]
edition = "2021"

[[bin]]
name = "nanoclaw-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tauri = { version = "2.2.5", features = [] }
